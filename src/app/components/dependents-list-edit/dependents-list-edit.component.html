<div class="p-4">
  <p class="text-xl font-semibold">Dependentes:</p>

  <button
    class="rounded-md px-3 pxy-2 text-lg font-medium my-2 text-white bg-green-700 hover:bg-green-500 transition ease-in-out"
  >
    Novo Dependente
  </button>

  <div class="my-4">
    <div class="grid lg:grid-cols-4 md:grid-cols-2 sm:grid-cols-2 gap-2">
      <mat-form-field class="w-full">
        <mat-label>Nome:</mat-label>
        <input matInput placeholder="Heitor" value="Heitor" />
      </mat-form-field>

      <mat-form-field class="w-full">
        <mat-label>Idade:</mat-label>
        <input matInput placeholder="21 anos" value="21 anos" />
      </mat-form-field>

      <mat-form-field class="w-full">
        <mat-label>Documento:</mat-label>
        <input matInput placeholder="123.123.123-12" value="123.123.123-12" />
      </mat-form-field>
      <div class="flex justify-center items-baseline box-border p-2">
        <button
          class="rounded-md px-3 pxy-2 text-lg font-medium my-2 text-white bg-red-700 hover:bg-red-500 transition ease-in-out"
        >
          Deletar
        </button>
      </div>
    </div>
  </div>
</div>
