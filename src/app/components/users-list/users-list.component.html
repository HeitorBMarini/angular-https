<div class="p-4 sm:grid-cols-1 grid md:grid-cols-3 md:gap-7 sm:gap-3">
  <div
    *ngFor="let user of userList"
    class="bg-white p-4 rounded border-b-gray-500 border-b-2 rounded-sm hover:bg-gray-200 shadow-md transition duration-300 ease-in-out"
  >
    <h2>{{ user.name }}</h2>
    <p>{{ user.email }}</p>
  </div>
</div>
