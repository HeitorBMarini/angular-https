<div class="p-4 bg-indigo-100 max-w-screen-xl mx-auto">
  <div class="p-5 rounded-xl bg-white">
    <div>
      <app-users-list [userList]="usersList"></app-users-list>

      <mat-tab-group [(selectedIndex)]="currentTabIndex">
        <mat-tab label="Geral">
          <app-general-informations [user]="usersList[0]"></app-general-informations>
        </mat-tab>
        <mat-tab label="Contato"> <app-contact-informations [user]="usersList[0]"></app-contact-informations></mat-tab>
        <mat-tab label="Dependentes">
          <app-dependents-list [dependentsList]="usersList[0]?.dependentsList"></app-dependents-list>
           </mat-tab>
      </mat-tab-group>
    </div>
  </div>
</div>
